# External inputs: a console or set-top box seen through a USB capture device.
#
# These are the defaults for every input. The settings page writes the viewer's
# own copy to ~/.config/freetvos/hdmi.conf, and per-device settings to
# ~/.config/freetvos/hdmi.d/, so nothing here is overwritten by the device.
#
# List what is attached with:
#   freetvos-hdmi list
# Check the display path with no dongle attached:
#   freetvos-hdmi selftest

# What happens when a capture device is plugged in while the TV is on.
#   switch   go straight to it, the way a television does
#   ignore   nothing
#
# There is deliberately no "just tell me" setting. Bigscreen's shell never
# claims the notification bus name, so a corner message is accepted by the
# system and then drawn by nobody; offering it would be offering something
# that silently does nothing. Switching is one press away from being undone.
ON_CONNECT="switch"

# How long to hold the sound back so it lands with the picture, in
# milliseconds. The dongle delays the picture by a frame or two while it
# compresses it; this is the knob that puts the two back together. Lower is
# better for games, higher is safer on slow hardware.
AUDIO_LATENCY_MS="40"

# The largest picture to ask a device for. Cheap dongles advertise sizes they
# cannot sustain and then deliver a few frames a second; capping this is how you
# get a smooth 1080p picture out of one that claims 4K.
MAX_HEIGHT="1080"

# Skip the source list and go straight to the picture when exactly one input is
# connected. Off by default, because the list is also the only way to reach
# these settings from a remote.
AUTO_OPEN_SINGLE="no"
