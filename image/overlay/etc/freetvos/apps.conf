# Which applications appear on the television.
#
# Bigscreen builds its tile grid from every installed desktop entry, so a
# package that ships one lands on your TV whether it belongs there or not.
# Listing an entry here hides it, by writing a NoDisplay override into the
# user's own applications directory. Nothing in /usr is touched, so an update
# cannot undo it and removing a line puts the app straight back.
#
# Entry ids are desktop file names without .desktop. List them with:
#   freetvos-apps list
# Apply changes with:
#   freetvos-apps apply

HIDE="
chromium-browser
kdesystemsettings
mpv
org.kde.kdeconnect.nonplasma
org.kde.kdeconnect.sms
org.kde.kmenuedit
org.kde.plasma.emojier
plasma-bigscreen-swap-session
"

# Entries listed here are always shown, even if something else would hide them.
# Takes precedence over HIDE.
SHOW="
"
