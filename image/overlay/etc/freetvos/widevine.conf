# Whether the device fetches the Widevine module by itself.
#
# The module cannot be shipped inside the image: its licence does not permit
# redistribution, and bundling it would make FreeTVOS undistributable. Fetching
# it on the device, from the vendor, is a different act and is what Raspberry Pi
# OS and LibreELEC do.
#
# On by default, because a television that cannot play Netflix until someone
# opens a terminal is not finished. Set to "no" if you are building an image for
# other people and would rather they made that choice themselves.
AUTO_INSTALL=yes
