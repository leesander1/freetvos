# Selecting the theme by config rather than by running plymouth-set-default-theme
# during the build, which reported the theme unchanged afterwards. This is the
# documented override and it is deterministic.
#
# One limitation worth knowing: Plymouth reads the theme from the initramfs for
# the earliest part of boot, and this image does not regenerate the initramfs.
# So the very first moments still use the built-in default and the FreeTVOS
# mark appears once the root filesystem is mounted. Closing that gap means
# regenerating the initrd at build time, which is a heavier change.
[Daemon]
Theme=freetvos
ShowDelay=0
DeviceTimeout=8
