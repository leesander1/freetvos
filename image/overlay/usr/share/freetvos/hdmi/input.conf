# What the remote does while an external input is on screen.
#
# mpv's own defaults are switched off, so this file is the whole keymap. That is
# deliberate: a remote sends key codes that a media player reads as letters, and
# a stray press should do nothing rather than cycle the subtitle track or start
# recording.
#
# Several names for the same idea, because there is no single code every remote
# sends for "back". The compositor also closes the focused window on XF86Back,
# which quits mpv by another route; both paths are wanted, since one of them is
# unreachable when the window is not focused.

ESC          quit
BS           quit
q            quit
CLOSE_WIN    quit
GO_BACK      quit
CANCEL       quit
STOP         quit
HOMEPAGE     quit
MENU         quit

# Volume belongs to the speakers, not to this window: the sound is bridged
# through the audio server and never passes through mpv, so mpv's own volume
# control would move a slider that nothing is listening to.
VOLUME_UP    run "/usr/bin/wpctl" "set-volume" "-l" "1.0" "@DEFAULT_AUDIO_SINK@" "5%+"
VOLUME_DOWN  run "/usr/bin/wpctl" "set-volume" "@DEFAULT_AUDIO_SINK@" "5%-"
MUTE         run "/usr/bin/wpctl" "set-mute" "@DEFAULT_AUDIO_SINK@" "toggle"

# What am I actually receiving. Worth having on a key: a console set to 4K on a
# dongle that can only take 1080p looks identical to a broken cable.
ENTER        show-text "${video-params/w}x${video-params/h} at ${estimated-vf-fps} fps" 4000
i            show-text "${video-params/w}x${video-params/h} at ${estimated-vf-fps} fps" 4000
