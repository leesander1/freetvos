# The remote while watching Live TV.
#
# Keys become messages to the player program rather than mpv commands, because
# a channel change means choosing the next channel, showing what is on it and
# remembering it, none of which mpv knows about.

UP             script-message freetvos up
DOWN           script-message freetvos down
PGUP           script-message freetvos up
PGDWN          script-message freetvos down
CHANNEL_UP     script-message freetvos up
CHANNEL_DOWN   script-message freetvos down
RIGHT          script-message freetvos up
LEFT           script-message freetvos down

ENTER          script-message freetvos info
i              script-message freetvos info

g              script-message freetvos guide
MENU           script-message freetvos guide

0 script-message freetvos digit 0
1 script-message freetvos digit 1
2 script-message freetvos digit 2
3 script-message freetvos digit 3
4 script-message freetvos digit 4
5 script-message freetvos digit 5
6 script-message freetvos digit 6
7 script-message freetvos digit 7
8 script-message freetvos digit 8
9 script-message freetvos digit 9

ESC            quit
BS             quit
q              quit
GO_BACK        quit
CLOSE_WIN      quit
HOMEPAGE       quit
STOP           quit

VOLUME_UP      run "/usr/bin/wpctl" "set-volume" "-l" "1.0" "@DEFAULT_AUDIO_SINK@" "5%+"
VOLUME_DOWN    run "/usr/bin/wpctl" "set-volume" "@DEFAULT_AUDIO_SINK@" "5%-"
MUTE           run "/usr/bin/wpctl" "set-mute" "@DEFAULT_AUDIO_SINK@" "toggle"
