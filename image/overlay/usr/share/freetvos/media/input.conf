# What the remote does while something is playing.
#
# mpv's own defaults are switched off, so this file is the whole keymap. A
# remote sends codes a media player reads as letters, and a stray press should
# do nothing rather than cycle a setting nobody meant to touch.
#
# Laid out the way a television remote is: the middle button plays and pauses,
# left and right step through, up and down jump further, and Back leaves.

ENTER        cycle pause
SPACE        cycle pause
PLAY         cycle pause
PAUSE        set pause yes
PLAYPAUSE    cycle pause

RIGHT        seek  10
LEFT         seek -10
UP           seek  60
DOWN         seek -60
FORWARD      seek  60
REWIND       seek -60
NEXT         playlist-next
PREV         playlist-prev

# Leaving writes the position, which is the whole point of the player
# remembering anything.
ESC          quit-watch-later
BS           quit-watch-later
q            quit-watch-later
CLOSE_WIN    quit-watch-later
GO_BACK      quit-watch-later
CANCEL       quit-watch-later
STOP         quit-watch-later
HOMEPAGE     quit-watch-later

s            cycle sub
a            cycle audio
c            cycle sub-visibility
i            show-text "${media-title}\n${time-pos} of ${duration}\n${video-params/w}x${video-params/h}${?estimated-vf-fps:  ${estimated-vf-fps} fps}" 5000
MENU         show-text "${media-title}\n${time-pos} of ${duration}" 5000

# Volume belongs to the speakers rather than to this window, so that turning it
# down here does not leave the next thing you open quietly playing.
VOLUME_UP    run "/usr/bin/wpctl" "set-volume" "-l" "1.0" "@DEFAULT_AUDIO_SINK@" "5%+"
VOLUME_DOWN  run "/usr/bin/wpctl" "set-volume" "@DEFAULT_AUDIO_SINK@" "5%-"
MUTE         run "/usr/bin/wpctl" "set-mute" "@DEFAULT_AUDIO_SINK@" "toggle"
