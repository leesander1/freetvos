# Swap compressed into memory, so a box with little RAM slows down under
# pressure instead of the kernel killing whatever is playing.
#
# The generator is in the base image but its defaults package is not, so
# without this file the television had no swap at all. On a 2 GB box one
# streaming app left 120 MB available, and opening a second for split view
# stalled the whole machine: nothing was killed, the screen just stopped
# drawing. See docs/RESOURCES.md for the measurements.
#
# The same sizing Fedora Workstation uses: as large as RAM, capped at 8 GB. It
# only takes memory as pages are actually swapped, at roughly a third of their
# size with zstd.
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
