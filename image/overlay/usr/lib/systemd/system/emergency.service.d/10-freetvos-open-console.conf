# A television has no root password, and this image locks the root account, so
# systemd's emergency and rescue shells would otherwise refuse everyone: "Cannot
# open access to console, the root account is locked". A box that has failed to
# boot must still be possible to look into. Whoever is at its keyboard already
# has the machine in their hands, which is the usual reasoning for appliances.
[Service]
Environment=SYSTEMD_SULOGIN_FORCE=1
