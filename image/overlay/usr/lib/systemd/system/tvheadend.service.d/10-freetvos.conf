# How TVHeadend runs on the television, replacing the package's own options.
#
# Listening on the box itself only, and with access control off. Together those
# mean the one thing that can reach it is software on this television, which is
# what Live TV is; nothing on the network can, so there is no login to set up and
# no password for anyone to forget. Anyone wanting it reachable from other
# machines changes the bind address and turns access control back on.
#
# SAT>IP client discovery is off: it probes the network for satellite servers,
# and satellite is not part of the setup on screen.
[Service]
ExecStart=
ExecStart=/usr/bin/tvheadend -f -p /run/tvheadend.pid -c /var/lib/tvheadend/config -u tvheadend -g video --bindaddr 127.0.0.1 --noacl --nosatipcli --http_port 9981 --htsp_port 9982
