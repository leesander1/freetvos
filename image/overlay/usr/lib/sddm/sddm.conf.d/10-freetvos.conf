# A television has no login screen. Boot straight into the Bigscreen session,
# and return to it if the shell ever exits.
[Autologin]
User=tv
Session=plasma-bigscreen-wayland
Relogin=true

[Theme]
Current=freetvos

[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=kwin_wayland --no-lockscreen
