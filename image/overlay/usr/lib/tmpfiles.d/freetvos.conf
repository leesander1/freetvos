# Directories that packages expect to exist but that bootc must recreate at
# runtime rather than carry in the image, because /var is machine-local state
# and anything baked there becomes a one-time factory default.
d /var/lib/AccountsService       0775 root root -
d /var/lib/AccountsService/icons 0775 root root -
d /var/lib/AccountsService/users 0700 root root -
d /var/lib/freetvos              0755 tv   tv   -

# Same again for the packages that create their state directories at install
# time. Declaring them here lets the cleanup step below strip them from /var.
d /var/lib/geoclue    0755 geoclue geoclue -
d /var/lib/plymouth   0755 root    root    -
d /var/spool/plymouth 0755 root    root    -

# Where the Widevine module lands. /opt/google/chrome/WidevineCdm in the image
# is a symlink to the WidevineCdm directory underneath this one.
d /var/lib/freetvos/widevine 0755 root root -

# Pulled in as dependencies; same treatment as the rest.
d /var/lib/PackageKit 0755 root root -
d /var/lib/tuned      0755 root root -
