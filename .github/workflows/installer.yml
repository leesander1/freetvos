# An x86_64 installer ISO, built where x86_64 is native.
#
# A Mac with Apple Silicon can build the x86_64 container image under
# emulation, but not a bootable disk from it (docs/INSTALL.md records why), and
# loading the 6 GB image by hand on a live USB runs out of memory: the live
# session holds its files in RAM, and podman load needs about twice the image.
# A GitHub runner is a real x86_64 machine, so bootc-image-builder works here
# as it was meant to, and the result is one ISO to write to a stick and boot.
#
# Widevine is left out. The repository is public and the module's licence does
# not allow redistributing it, so an image built here must not carry it. The
# television fetches it itself on first boot instead, as the image already does
# whenever it is built without the module.
#
# The image is also published, to GitHub's container registry, and that is how
# televisions update: each one follows ghcr.io/<owner>/<repo>:latest and
# checks it every night (docs/UPDATES.md). Every push to main that reaches this
# workflow is therefore an update for every television following it.

name: Installer ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "brand/**"
      - "webapps/**"
      - "cast/**"
      - ".github/workflows/installer.yml"

# A new push supersedes a build still running for an older one.
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write     # the release
  packages: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      # Whole history and tags, so the release notes can list what changed
      # since the previous release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The image is about 6 GB, and building the ISO holds several copies of
      # it at once. The runner's disk starts mostly full of toolchains this job
      # does not use.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Leave Widevine out of this build
        run: |
          sed -i 's/^BUNDLE_WIDEVINE=.*/BUNDLE_WIDEVINE="no"/' brand/brand.env
          grep '^BUNDLE_WIDEVINE=' brand/brand.env

      - name: Build the image
        run: sudo IMAGE_SOURCE="https://github.com/${GITHUB_REPOSITORY}" tools/build.sh amd64

      # Rechunked, so a television downloads only what changed. Built from
      # scratch here every time, the image's layers are new bytes in every build
      # even where nothing changed, and every update was the whole system, some
      # gigabytes. Fedora's own tool regroups it into layers by package, and
      # --previous-build keeps the grouping of the image already published, so
      # a package that did not change lands in a byte-identical layer that a
      # television already has. A trial of two builds made from scratch, one
      # file apart, shared 61 of 65 layers: 138 MB new of 1,001 MB.
      #
      # The previous build is asked for first and left out if it cannot be
      # read, so the very first run, or a registry hiccup, costs one full
      # download on the television rather than a failed build.
      - name: Rechunk for small updates
        run: |
          . brand/brand.env
          SRC="${IMAGE_REF}:${BRAND_VERSION}-amd64"
          PREV="docker://ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          rechunk() {
            sudo podman run --rm --privileged \
              -v /var/lib/containers:/var/lib/containers \
              "quay.io/fedora/fedora-bootc:${FEDORA_RELEASE}-x86_64" \
              rpm-ostree compose build-chunked-oci --bootc --format-version=2 \
                --from="$SRC" --output "containers-storage:${SRC}-chunked" "$@"
          }
          rechunk --previous-build="$PREV" || rechunk
          sudo podman tag "${SRC}-chunked" "$SRC"
          # Only tags go; then the unchunked copy has none left and is pruned.
          sudo podman rmi "${SRC}-chunked" "${IMAGE_REF}:latest"
          sudo podman image prune -f
          sudo podman image inspect "$SRC" --format \
            '{{len .RootFS.Layers}} layers, version {{index .Config.Labels "org.opencontainers.image.version"}}'
          df -h /

      # Unattended, and it only ever erases nvme0n1: the one M.2 SSD a
      # Framework mainboard has. Every other disk is ignored, so the USB stick
      # it boots from cannot be chosen, and a machine without that drive stops
      # instead of installing somewhere else. No account settings: the image
      # already creates the tv account and logs it in.
      #
      # --nohome matters. On a large drive automatic partitioning splits off a
      # /home partition, and on a bootc system /home is a link to /var/home, so
      # it cannot be mounted: the first install on real hardware stopped in
      # emergency mode on "Mount path /home is not canonical". A 40 GB test
      # disk never showed it, because it was too small to get a /home.
      #
      # xconfig --startxonboot and the %post both say the same thing: boot to
      # the television, not a text console. A text-mode install otherwise
      # writes multi-user.target as the default over the image's graphical
      # one, so SDDM never starts and the box stops at "fedora login:". The
      # %post makes it certain even if a later Anaconda ignores xconfig.
      #
      # The bootloader line gives an installed system the same kernel options
      # as the VM's disk: quiet and splash hand the boot to the FreeTVOS
      # Plymouth theme instead of a screen of scrolling text.
      #
      # bootc switch points the installed system at the published image, so it
      # can update. Without it, it would follow the copy on the USB stick,
      # which can never be downloaded again. --mutate-in-place only rewrites
      # where updates come from; nothing is downloaded during the install.
      - name: Installer settings
        run: |
          mkdir -p output
          UPDATE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          cat > output/config.toml <<EOF
          [customizations.installer.kickstart]
          contents = """
          text --non-interactive
          ignoredisk --only-use=nvme0n1
          zerombr
          clearpart --all --initlabel --disklabel=gpt --drives=nvme0n1
          autopart --noswap --nohome --type=plain
          rootpw --lock
          xconfig --startxonboot
          bootloader --append="quiet splash rd.systemd.show_status=false plymouth.ignore-serial-consoles"
          reboot --eject
          %post
          systemctl set-default graphical.target
          bootc switch --mutate-in-place --transport registry ${UPDATE_IMAGE}
          %end
          """
          EOF
          cat output/config.toml

      - name: Build the installer ISO
        run: |
          . brand/brand.env
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output:/output" \
            -v "$PWD/output/config.toml:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
              --type anaconda-iso \
              --local \
              "${IMAGE_REF}:${BRAND_VERSION}-amd64"
          sudo mv output/bootiso/install.iso output/freetvos-amd64-installer.iso
          sudo chown "$USER" output/freetvos-amd64-installer.iso
          ls -lh output/freetvos-amd64-installer.iso
          sha256sum output/freetvos-amd64-installer.iso | tee output/freetvos-amd64-installer.iso.sha256

      # After the installer, so a build whose installer fails publishes
      # nothing. The commit's own tag is kept beside latest, so any version
      # can be gone back to with bootc switch.
      - name: Publish the image for updates
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . brand/brand.env
          DEST="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "${GITHUB_SHA::7}"; do
            sudo podman push "${IMAGE_REF}:${BRAND_VERSION}-amd64" "docker://${DEST}:${tag}"
          done
          echo "Published ${DEST}:latest and ${DEST}:${GITHUB_SHA::7}"

      - name: Offer the ISO for download
        uses: actions/upload-artifact@v4
        with:
          name: freetvos-amd64-installer
          path: |
            output/freetvos-amd64-installer.iso
            output/freetvos-amd64-installer.iso.sha256
          compression-level: 0
          retention-days: 14

      # A release per build, so each version has a permanent download that
      # needs no GitHub account; the artifact above needs one to download and
      # is gone after 14 days. GitHub refuses release files over 2 GB and the
      # installer is nearer 4, so it goes up in two parts with the way to join
      # them in the notes. Earlier releases are kept.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . brand/brand.env
          DAY="$(date -u +%Y-%m-%d)"
          TAG="v${BRAND_VERSION}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          PREV="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"

          cd output
          ISO=freetvos-amd64-installer.iso
          split -b 1900M -d -a 1 "$ISO" "$ISO.part"
          sha256sum "$ISO" "$ISO".part* > SHA256SUMS
          ls -lh "$ISO".part* SHA256SUMS

          {
            echo "FreeTVOS ${BRAND_VERSION} for x86_64 PCs, built ${DAY} from ${GITHUB_SHA::7}."
            echo
            echo "## Install"
            echo
            echo "Download both parts, join them into one ISO, write it to a USB stick with"
            echo "Fedora Media Writer and boot from it. The install erases the machine's"
            echo "NVMe drive; see [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md)."
            echo
            echo "Mac or Linux:"
            echo
            echo '```'
            echo "cat $ISO.part0 $ISO.part1 > $ISO"
            echo "shasum -a 256 $ISO    # should match its line in SHA256SUMS"
            echo '```'
            echo
            echo "Windows (Command Prompt):"
            echo
            echo '```'
            echo "copy /b $ISO.part0 + $ISO.part1 $ISO"
            echo '```'
            echo
            echo "A television already running FreeTVOS updates itself to this version;"
            echo "see [UPDATES.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/UPDATES.md)."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "$PREV..$GITHUB_SHA"
            else
              git log --no-merges --pretty='- %s' -20 "$GITHUB_SHA"
            fi
          } > notes.md

          gh release create "$TAG" --target "$GITHUB_SHA" --latest \
            --title "FreeTVOS ${BRAND_VERSION} (${DAY}, ${GITHUB_SHA::7})" \
            --notes-file notes.md \
            "$ISO".part* SHA256SUMS
